components:
  schemas:
    CreateKeyRequest:
      additionalProperties: false
      properties:
        expires_in:
          description: The key stops working after this long.
          examples:
            - 720h
          type: string
        name:
          examples:
            - ci-runner
          maxLength: 100
          minLength: 1
          type: string
        policy:
          $ref: "#/components/schemas/Policy"
        scopes:
          examples:
            - - sessions:run
              - sessions:read
          items:
            enum:
              - sessions:run
              - sessions:read
              - jobs:run
              - jobs:read
              - queues:write
              - templates:run
              - templates:read
              - templates:write
              - admin:read
            type: string
          minItems: 1
          type:
            - array
            - "null"
      required:
        - name
        - scopes
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    Event:
      additionalProperties: false
      properties:
        data:
          description: "stdout and stderr: the output chunk, when it is valid UTF-8."
          type: string
        data_b64:
          contentEncoding: base64
          description: "stdout and stderr: the output chunk, when it is not valid UTF-8."
          type: string
        duration_ms:
          description: "exit: run time in milliseconds."
          format: int64
          type: integer
        error:
          description: "error, step_finished, job_finished: what went wrong."
          type: string
        exit_code:
          description: "exit: the exit code, unless a signal ended the process."
          format: int64
          type: integer
        pid:
          description: "started: the process id."
          format: int64
          type: integer
        seq:
          description: Sequence number, starting at 1 with no gaps.
          format: int64
          minimum: 0
          type: integer
        session_id:
          description: "step_started and step_finished: the step's session."
          type: string
        signal:
          description: "signal: the signal sent. exit: the signal that ended the process."
          type: string
        state:
          description: "exit: the final session state. step_finished and job_finished: the step's or job's final state."
          type: string
        step:
          description: "step_started and step_finished: the step name."
          type: string
        time:
          format: date-time
          type: string
        type:
          enum:
            - started
            - stdout
            - stderr
            - stdin_closed
            - signal
            - exit
            - error
            - job_started
            - step_started
            - step_finished
            - job_finished
          type: string
      required:
        - seq
        - time
        - type
      type: object
    Job:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        ended_at:
          format: date-time
          type: string
        error:
          type: string
        expires_at:
          format: date-time
          type: string
        id:
          type: string
        key_id:
          type: string
        spec:
          $ref: "#/components/schemas/JobSpec"
        started_at:
          format: date-time
          type: string
        state:
          enum:
            - queued
            - running
            - succeeded
            - failed
            - cancelled
            - lost
          type: string
        steps:
          items:
            $ref: "#/components/schemas/StepStatus"
          type:
            - array
            - "null"
      required:
        - id
        - key_id
        - spec
        - state
        - steps
        - created_at
      type: object
    JobList:
      additionalProperties: false
      properties:
        jobs:
          items:
            $ref: "#/components/schemas/Job"
          type:
            - array
            - "null"
        next_cursor:
          type: string
      required:
        - jobs
      type: object
    JobSpec:
      additionalProperties: false
      properties:
        env:
          additionalProperties:
            type: string
          description: Added to every step's environment; a step's own env wins.
          type: object
        labels:
          additionalProperties:
            type: string
          type: object
        name:
          examples:
            - deploy
          maxLength: 100
          type: string
        on_restart:
          description: "After a server restart: fail the job (default) or re-run the interrupted steps and continue."
          enum:
            - fail
            - resume
          type: string
        queue:
          description: Run through this queue; omit to start at once.
          examples:
            - default
          type: string
        retention:
          description: Keep the job this long after it ends. Defaults to the server setting.
          examples:
            - 24h
          type: string
        steps:
          items:
            $ref: "#/components/schemas/JobStep"
          maxItems: 100
          minItems: 1
          type:
            - array
            - "null"
      required:
        - steps
      type: object
    JobStep:
      additionalProperties: false
      properties:
        allow_failure:
          description: A failure of this step does not fail the job or skip its dependents.
          type: boolean
        depends_on:
          description: Steps that must succeed first. If no step sets this, steps run in order.
          items:
            type: string
          type:
            - array
            - "null"
        name:
          examples:
            - build
          pattern: ^[A-Za-z0-9_.-]{1,64}$
          type: string
        spec:
          $ref: "#/components/schemas/SessionSpec"
      required:
        - spec
      type: object
    Key:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        expires_at:
          format: date-time
          type: string
        id:
          type: string
        last_used_at:
          format: date-time
          type: string
        name:
          type: string
        policy:
          $ref: "#/components/schemas/Policy"
        previous_secret_valid_until:
          format: date-time
          type: string
        revoked_at:
          format: date-time
          type: string
        scopes:
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - id
        - name
        - scopes
        - policy
        - created_at
      type: object
    KeyList:
      additionalProperties: false
      properties:
        keys:
          items:
            $ref: "#/components/schemas/Key"
          type:
            - array
            - "null"
      required:
        - keys
      type: object
    KeyWithSecret:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        expires_at:
          format: date-time
          type: string
        id:
          type: string
        key:
          description: The full bearer token. Shown only in this response.
          type: string
        last_used_at:
          format: date-time
          type: string
        name:
          type: string
        policy:
          $ref: "#/components/schemas/Policy"
        previous_secret_valid_until:
          format: date-time
          type: string
        revoked_at:
          format: date-time
          type: string
        scopes:
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - key
        - id
        - name
        - scopes
        - policy
        - created_at
      type: object
    Policy:
      additionalProperties: false
      properties:
        allow_shell:
          description: Allow shell sessions. Defaults to true. Must be false for commands to restrict anything.
          type: boolean
        commands:
          description: Regular expressions; the absolute program path must fully match one.
          examples:
            - - /usr/bin/(git|make)
          items:
            type: string
          type:
            - array
            - "null"
        cwd_roots:
          description: Working directories must be inside one of these. The first is the default.
          items:
            type: string
          type:
            - array
            - "null"
        env_allow:
          description: Regular expressions every env variable name must fully match.
          items:
            type: string
          type:
            - array
            - "null"
        max_concurrent_sessions:
          description: Maximum running sessions for this key.
          format: int64
          minimum: 0
          type: integer
        max_timeout:
          description: Maximum session timeout, also used when none is given.
          examples:
            - 30m
          type: string
        templates:
          description: Templates this key may run. Empty means all.
          items:
            type: string
          type:
            - array
            - "null"
      type: object
    PutQueueRequest:
      additionalProperties: false
      properties:
        concurrency:
          format: int64
          maximum: 1000
          minimum: 1
          type: integer
      required:
        - concurrency
      type: object
    Queue:
      additionalProperties: false
      properties:
        concurrency:
          format: int64
          type: integer
        name:
          type: string
        queued:
          description: Jobs waiting in this queue.
          format: int64
          type: integer
        running:
          description: Jobs of this queue running now.
          format: int64
          type: integer
      required:
        - name
        - concurrency
        - running
        - queued
      type: object
    QueueList:
      additionalProperties: false
      properties:
        queues:
          items:
            $ref: "#/components/schemas/Queue"
          type:
            - array
            - "null"
      required:
        - queues
      type: object
    RevokeKeyResponse:
      additionalProperties: false
      properties:
        key:
          $ref: "#/components/schemas/Key"
        killed_sessions:
          format: int64
          type: integer
      required:
        - key
        - killed_sessions
      type: object
    RotateKeyRequest:
      additionalProperties: false
      properties:
        grace:
          description: Keep the previous secret valid for this long.
          examples:
            - 1h
          type: string
      type: object
    RunResult:
      additionalProperties: false
      properties:
        session:
          $ref: "#/components/schemas/Session"
        stderr:
          type: string
        stderr_b64:
          contentEncoding: base64
          type: string
        stderr_truncated:
          type: boolean
        stdout:
          type: string
        stdout_b64:
          contentEncoding: base64
          type: string
        stdout_truncated:
          type: boolean
      required:
        - session
      type: object
    RunTemplateRequest:
      additionalProperties: false
      properties:
        params:
          additionalProperties:
            type: string
          description: Parameter values, as strings.
          type: object
      type: object
    RunTemplateResponse:
      additionalProperties: false
      properties:
        job:
          $ref: "#/components/schemas/Job"
        session:
          $ref: "#/components/schemas/Session"
      type: object
    Session:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        duration_ms:
          format: int64
          type: integer
        ended_at:
          format: date-time
          type: string
        error:
          description: Why the session failed to start or was lost.
          type: string
        exit_code:
          description: Set when the process exited normally.
          format: int64
          type: integer
        expires_at:
          format: date-time
          type: string
        id:
          type: string
        key_id:
          type: string
        pid:
          format: int64
          type: integer
        signal:
          description: The signal that ended the process.
          type: string
        spec:
          $ref: "#/components/schemas/SessionSpec"
        started_at:
          format: date-time
          type: string
        state:
          enum:
            - pending
            - running
            - exited
            - failed_to_start
            - killed
            - timed_out
            - lost
          type: string
        stdin_open:
          description: Whether stdin still accepts input.
          type: boolean
      required:
        - id
        - key_id
        - spec
        - state
        - created_at
        - stdin_open
      type: object
    SessionList:
      additionalProperties: false
      properties:
        next_cursor:
          description: Pass as cursor to get the next page.
          type: string
        sessions:
          items:
            $ref: "#/components/schemas/Session"
          type:
            - array
            - "null"
      required:
        - sessions
      type: object
    SessionSpec:
      additionalProperties: false
      properties:
        argv:
          description: Program and arguments. Set exactly one of argv and shell.
          examples:
            - - ls
              - -l
          items:
            type: string
          minItems: 1
          type:
            - array
            - "null"
        cwd:
          description: Absolute working directory.
          examples:
            - /srv/app
          type: string
        env:
          additionalProperties:
            type: string
          description: Extra environment variables.
          type: object
        inherit_env:
          description: Start from the server's environment. Defaults to true.
          type: boolean
        labels:
          additionalProperties:
            type: string
          description: Free-form metadata usable as list filters.
          type: object
        merge_stderr:
          description: Send stderr through the stdout pipe, preserving their relative order.
          type: boolean
        retention:
          description: Keep the session and its output this long after it ends. Defaults to the server setting.
          examples:
            - 24h
          type: string
        shell:
          description: Command line run with sh -c (cmd /C on Windows).
          examples:
            - ls -l | wc -l
          type: string
        stdin:
          description: Written to stdin when the process starts.
          type: string
        stdin_b64:
          contentEncoding: base64
          description: Binary initial stdin. At most one of stdin and stdin_b64.
          type: string
        stdin_close:
          description: Close stdin after the initial input.
          type: boolean
        timeout:
          description: Stop the process after this long.
          examples:
            - 10m
          type: string
      type: object
    SignalRequest:
      additionalProperties: false
      properties:
        signal:
          description: Signal name, with or without the SIG prefix.
          examples:
            - SIGINT
          type: string
      required:
        - signal
      type: object
    StdinResponse:
      additionalProperties: false
      properties:
        bytes:
          format: int64
          type: integer
        stdin_open:
          type: boolean
      required:
        - bytes
        - stdin_open
      type: object
    StepStatus:
      additionalProperties: false
      properties:
        ended_at:
          format: date-time
          type: string
        error:
          type: string
        exit_code:
          format: int64
          type: integer
        name:
          type: string
        session_id:
          description: The step's session; read its output through the session endpoints.
          type: string
        signal:
          type: string
        started_at:
          format: date-time
          type: string
        state:
          enum:
            - pending
            - running
            - succeeded
            - failed
            - skipped
            - cancelled
          type: string
      required:
        - name
        - state
      type: object
    Template:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        description:
          type: string
        job:
          $ref: "#/components/schemas/JobSpec"
        name:
          type: string
        params:
          additionalProperties:
            $ref: "#/components/schemas/TemplateParam"
          type: object
        session:
          $ref: "#/components/schemas/SessionSpec"
          description: Set exactly one of session and job.
        updated_at:
          format: date-time
          type: string
        updated_by:
          type: string
      required:
        - name
        - created_at
        - updated_at
        - updated_by
      type: object
    TemplateList:
      additionalProperties: false
      properties:
        templates:
          items:
            $ref: "#/components/schemas/Template"
          type:
            - array
            - "null"
      required:
        - templates
      type: object
    TemplateParam:
      additionalProperties: false
      properties:
        default:
          description: Value used when the parameter is not given. Without a default the parameter is required.
          type: string
        description:
          type: string
        enum:
          description: Allowed values.
          items:
            type: string
          type:
            - array
            - "null"
        pattern:
          description: Regular expression the whole value must match.
          type: string
        type:
          description: Defaults to string.
          enum:
            - string
            - int
            - bool
          type: string
      type: object
    TemplateSpec:
      additionalProperties: false
      properties:
        description:
          type: string
        job:
          $ref: "#/components/schemas/JobSpec"
        params:
          additionalProperties:
            $ref: "#/components/schemas/TemplateParam"
          type: object
        session:
          $ref: "#/components/schemas/SessionSpec"
          description: Set exactly one of session and job.
      type: object
    UpdateKeyRequest:
      additionalProperties: false
      properties:
        clear_expiry:
          description: Remove the expiry.
          type: boolean
        expires_at:
          format: date-time
          type: string
        name:
          type: string
        policy:
          $ref: "#/components/schemas/Policy"
        scopes:
          items:
            enum:
              - sessions:run
              - sessions:read
              - jobs:run
              - jobs:read
              - queues:write
              - templates:run
              - templates:read
              - templates:write
              - admin:read
            type: string
          type: array
      type: object
    Version:
      additionalProperties: false
      properties:
        version:
          type: string
      required:
        - version
      type: object
    Whoami:
      additionalProperties: false
      properties:
        key:
          $ref: "#/components/schemas/Key"
        master:
          type: boolean
        notes:
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - master
      type: object
  securitySchemes:
    bearer:
      description: The master key (`shhm_…`) for /v2/keys, an API key (`shh_…`) for everything else.
      scheme: bearer
      type: http
info:
  description: Run commands remotely, stream their output and send them input. See https://github.com/codemug/shhttp/blob/v2/docs/v2-design.md.
  title: shhttp
  version: "2.0"
openapi: 3.1.0
paths:
  /healthz:
    get:
      operationId: health
      responses:
        "200":
          content:
            application/json:
              schema:
                contentEncoding: base64
                type: string
          description: OK
          headers:
            Content-Type:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Health check
      tags:
        - Server
  /v2/exec:
    get:
      description: Upgrades to a WebSocket. Offer the `shhttp.v2.json` subprotocol; browsers, which cannot set an Authorization header, also offer `shhttp.v2.auth.<key>`. The first client message must be `{"type":"start","spec":{…}}`. The server answers with a `session` message followed by the session's events. Clients then send `stdin`, `stdin_close` and `signal` messages. The server closes the connection with status 1000 when the session ends. See docs/v2-design.md for the full protocol.
      operationId: exec
      responses:
        "101":
          description: "Switching Protocols: the connection is now a WebSocket using the shhttp.v2.json protocol."
        "200":
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - bearer: []
      summary: Start a session over a WebSocket
      tags:
        - WebSocket
  /v2/jobs:
    get:
      description: Newest first. A key sees its own jobs; admin:read sees every key's.
      operationId: list-jobs
      parameters:
        - description: Only jobs in this state.
          explode: false
          in: query
          name: state
          schema:
            description: Only jobs in this state.
            enum:
              - queued
              - running
              - succeeded
              - failed
              - cancelled
              - lost
            type: string
        - description: Only jobs of this queue.
          explode: false
          in: query
          name: queue
          schema:
            description: Only jobs of this queue.
            type: string
        - description: Only jobs of this key. Other keys' jobs need the admin:read scope.
          explode: false
          in: query
          name: key_id
          schema:
            description: Only jobs of this key. Other keys' jobs need the admin:read scope.
            type: string
        - description: Only jobs with this label, written key=value.
          explode: true
          in: query
          name: label
          schema:
            description: Only jobs with this label, written key=value.
            items:
              type: string
            type:
              - array
              - "null"
        - explode: false
          in: query
          name: limit
          schema:
            default: 50
            format: int64
            maximum: 500
            minimum: 1
            type: integer
        - explode: false
          in: query
          name: cursor
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobList"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - bearer: []
      summary: List jobs
      tags:
        - Jobs
    post:
      description: Steps run one after another unless any step sets depends_on, in which case they form a dependency graph and independent steps run in parallel. Every step is checked against the key's policy at submission. With a queue the job waits its turn; without one it starts at once. Each step runs as a session labelled shhttp.job and shhttp.step; read its output through the session endpoints (sessions:read).
      operationId: submit-job
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobSpec"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
          description: Created
          headers:
            Location:
              schema:
                type: string
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      security:
        - bearer: []
      summary: Submit a job
      tags:
        - Jobs
  /v2/jobs/{id}:
    delete:
      description: Cancels the job if needed, then deletes it, its events and its step sessions.
      operationId: delete-job
      parameters:
        - description: Job id
          in: path
          name: id
          required: true
          schema:
            description: Job id
            examples:
