components:
  schemas:
    CreateKeyRequest:
      additionalProperties: false
      properties:
        expires_in:
          description: The key stops working after this long.
          examples:
            - 720h
          type: string
        name:
          examples:
            - ci-runner
          maxLength: 100
          minLength: 1
          type: string
        policy:
          $ref: "#/components/schemas/Policy"
        scopes:
          examples:
            - - sessions:run
              - sessions:read
          items:
            enum:
              - sessions:run
              - sessions:read
              - admin:read
            type: string
          minItems: 1
          type:
            - array
            - "null"
      required:
        - name
        - scopes
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    Event:
      additionalProperties: false
      properties:
        data:
          description: "stdout and stderr: the output chunk, when it is valid UTF-8."
          type: string
        data_b64:
          contentEncoding: base64
          description: "stdout and stderr: the output chunk, when it is not valid UTF-8."
          type: string
        duration_ms:
          description: "exit: run time in milliseconds."
          format: int64
          type: integer
        error:
          description: "error: what went wrong."
          type: string
        exit_code:
          description: "exit: the exit code, unless a signal ended the process."
          format: int64
          type: integer
        pid:
          description: "started: the process id."
          format: int64
          type: integer
        seq:
          description: Sequence number, starting at 1 with no gaps.
          format: int64
          minimum: 0
          type: integer
        signal:
          description: "signal: the signal sent. exit: the signal that ended the process."
          type: string
        state:
          description: "exit: the final session state."
          type: string
        time:
          format: date-time
          type: string
        type:
          enum:
            - started
            - stdout
            - stderr
            - stdin_closed
            - signal
            - exit
            - error
          type: string
      required:
        - seq
        - time
        - type
      type: object
    Key:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        expires_at:
          format: date-time
          type: string
        id:
          type: string
        last_used_at:
          format: date-time
          type: string
        name:
          type: string
        policy:
          $ref: "#/components/schemas/Policy"
        previous_secret_valid_until:
          format: date-time
          type: string
        revoked_at:
          format: date-time
          type: string
        scopes:
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - id
        - name
        - scopes
        - policy
        - created_at
      type: object
    KeyList:
      additionalProperties: false
      properties:
        keys:
          items:
            $ref: "#/components/schemas/Key"
          type:
            - array
            - "null"
      required:
        - keys
      type: object
    KeyWithSecret:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        expires_at:
          format: date-time
          type: string
        id:
          type: string
        key:
          description: The full bearer token. Shown only in this response.
          type: string
        last_used_at:
          format: date-time
          type: string
        name:
          type: string
        policy:
          $ref: "#/components/schemas/Policy"
        previous_secret_valid_until:
          format: date-time
          type: string
        revoked_at:
          format: date-time
          type: string
        scopes:
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - key
        - id
        - name
        - scopes
        - policy
        - created_at
      type: object
    Policy:
      additionalProperties: false
      properties:
        allow_shell:
          description: Allow shell sessions. Defaults to true. Must be false for commands to restrict anything.
          type: boolean
        commands:
          description: Regular expressions; the absolute program path must fully match one.
          examples:
            - - /usr/bin/(git|make)
          items:
            type: string
          type:
            - array
            - "null"
        cwd_roots:
          description: Working directories must be inside one of these. The first is the default.
          items:
            type: string
          type:
            - array
            - "null"
        env_allow:
          description: Regular expressions every env variable name must fully match.
          items:
            type: string
          type:
            - array
            - "null"
        max_concurrent_sessions:
          description: Maximum running sessions for this key.
          format: int64
          minimum: 0
          type: integer
        max_timeout:
          description: Maximum session timeout, also used when none is given.
          examples:
            - 30m
          type: string
      type: object
    RevokeKeyResponse:
      additionalProperties: false
      properties:
        key:
          $ref: "#/components/schemas/Key"
        killed_sessions:
          format: int64
          type: integer
      required:
        - key
        - killed_sessions
      type: object
    RotateKeyRequest:
      additionalProperties: false
      properties:
        grace:
          description: Keep the previous secret valid for this long.
          examples:
            - 1h
          type: string
      type: object
    RunResult:
      additionalProperties: false
      properties:
        session:
          $ref: "#/components/schemas/Session"
        stderr:
          type: string
        stderr_b64:
          contentEncoding: base64
          type: string
        stderr_truncated:
          type: boolean
        stdout:
          type: string
        stdout_b64:
          contentEncoding: base64
          type: string
        stdout_truncated:
          type: boolean
      required:
        - session
      type: object
    Session:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        duration_ms:
          format: int64
          type: integer
        ended_at:
          format: date-time
          type: string
        error:
          description: Why the session failed to start or was lost.
          type: string
        exit_code:
          description: Set when the process exited normally.
          format: int64
          type: integer
        expires_at:
          format: date-time
          type: string
        id:
          type: string
        key_id:
          type: string
        pid:
          format: int64
          type: integer
        signal:
          description: The signal that ended the process.
          type: string
        spec:
          $ref: "#/components/schemas/SessionSpec"
        started_at:
          format: date-time
          type: string
        state:
          enum:
            - pending
            - running
            - exited
            - failed_to_start
            - killed
            - timed_out
            - lost
          type: string
        stdin_open:
          description: Whether stdin still accepts input.
          type: boolean
      required:
        - id
        - key_id
        - spec
        - state
        - created_at
        - stdin_open
      type: object
    SessionList:
      additionalProperties: false
      properties:
        next_cursor:
          description: Pass as cursor to get the next page.
          type: string
        sessions:
          items:
            $ref: "#/components/schemas/Session"
          type:
            - array
            - "null"
      required:
        - sessions
      type: object
    SessionSpec:
      additionalProperties: false
      properties:
        argv:
          description: Program and arguments. Set exactly one of argv and shell.
          examples:
            - - ls
              - -l
          items:
            type: string
          minItems: 1
          type:
            - array
            - "null"
        cwd:
          description: Absolute working directory.
          examples:
            - /srv/app
          type: string
        env:
          additionalProperties:
            type: string
          description: Extra environment variables.
          type: object
        inherit_env:
          description: Start from the server's environment. Defaults to true.
          type: boolean
        labels:
          additionalProperties:
            type: string
          description: Free-form metadata usable as list filters.
          type: object
        merge_stderr:
          description: Send stderr through the stdout pipe, preserving their relative order.
          type: boolean
        retention:
          description: Keep the session and its output this long after it ends. Defaults to the server setting.
          examples:
            - 24h
          type: string
        shell:
          description: Command line run with sh -c (cmd /C on Windows).
          examples:
            - ls -l | wc -l
          type: string
        stdin:
          description: Written to stdin when the process starts.
          type: string
        stdin_b64:
          contentEncoding: base64
          description: Binary initial stdin. At most one of stdin and stdin_b64.
          type: string
        stdin_close:
          description: Close stdin after the initial input.
          type: boolean
        timeout:
          description: Stop the process after this long.
          examples:
            - 10m
          type: string
      type: object
    SignalRequest:
      additionalProperties: false
      properties:
        signal:
          description: Signal name, with or without the SIG prefix.
          examples:
            - SIGINT
          type: string
      required:
        - signal
      type: object
    StdinResponse:
      additionalProperties: false
      properties:
        bytes:
          format: int64
          type: integer
        stdin_open:
          type: boolean
      required:
        - bytes
        - stdin_open
      type: object
    UpdateKeyRequest:
      additionalProperties: false
      properties:
        clear_expiry:
          description: Remove the expiry.
          type: boolean
        expires_at:
          format: date-time
          type: string
        name:
          type: string
        policy:
          $ref: "#/components/schemas/Policy"
        scopes:
          items:
            enum:
              - sessions:run
              - sessions:read
              - admin:read
            type: string
          type: array
      type: object
    Version:
      additionalProperties: false
      properties:
        version:
          type: string
      required:
        - version
      type: object
    Whoami:
      additionalProperties: false
      properties:
        key:
          $ref: "#/components/schemas/Key"
        master:
          type: boolean
        notes:
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - master
      type: object
  securitySchemes:
    bearer:
      description: The master key (`shhm_…`) for /v2/keys, an API key (`shh_…`) for everything else.
      scheme: bearer
      type: http
info:
  description: Run commands remotely, stream their output and send them input. See https://github.com/codemug/shhttp/blob/v2/docs/v2-design.md.
  title: shhttp
  version: "2.0"
openapi: 3.1.0
paths:
  /healthz:
    get:
      operationId: health
      responses:
        "200":
          content:
            application/json:
              schema:
                contentEncoding: base64
                type: string
          description: OK
          headers:
            Content-Type:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Health check
      tags:
        - Server
  /v2/keys:
    get:
      description: Includes revoked and expired keys. Secrets are never returned.
      operationId: list-keys
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyList"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - bearer: []
      summary: List API keys
      tags:
        - Keys
    post:
      description: The response contains the full key in `key`. It is shown only once.
      operationId: create-key
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateKeyRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyWithSecret"
          description: Created
          headers:
            Location:
              schema:
                type: string
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - bearer: []
      summary: Create an API key
      tags:
        - Keys
  /v2/keys/{id}:
    delete:
      description: Revocation is permanent. The key's running sessions keep running unless `kill_sessions=true`.
      operationId: revoke-key
      parameters:
        - description: Key id
          in: path
          name: id
          required: true
          schema:
            description: Key id
            examples:
              - key_01j9z3k5q8m2x7v4w6t0b1c3d5
            type: string
        - description: Also kill the key's running sessions.
          explode: false
          in: query
          name: kill_sessions
          schema:
            description: Also kill the key's running sessions.
            type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevokeKeyResponse"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - bearer: []
      summary: Revoke an API key
      tags:
        - Keys
    get:
      operationId: get-key
      parameters:
        - description: Key id
          in: path
          name: id
          required: true
          schema:
            description: Key id
            examples:
              - key_01j9z3k5q8m2x7v4w6t0b1c3d5
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Key"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - bearer: []
      summary: Get an API key
      tags:
        - Keys
    patch:
      description: Changes the name, scopes, policy or expiry. Omitted fields are left unchanged.
      operationId: update-key
      parameters:
        - description: Key id
          in: path
          name: id
          required: true
          schema:
            description: Key id
            examples:
              - key_01j9z3k5q8m2x7v4w6t0b1c3d5
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateKeyRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Key"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - bearer: []
      summary: Update an API key
      tags:
        - Keys
  /v2/keys/{id}/rotate:
    post:
      description: Returns the new full key once. With `grace`, the previous secret keeps working for that long; otherwise it stops working immediately.
      operationId: rotate-key
      parameters:
        - description: Key id
          in: path
          name: id
          required: true
          schema:
            description: Key id
            examples:
              - key_01j9z3k5q8m2x7v4w6t0b1c3d5
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RotateKeyRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyWithSecret"
          description: OK
          headers:
            Location:
              schema:
                type: string
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - bearer: []
      summary: Issue a new secret for an API key
      tags:
        - Keys
  /v2/sessions:
    get:
      description: Newest first. A key sees its own sessions; `admin:read` sees every key's.
      operationId: list-sessions
      parameters:
        - description: Only sessions in this state.
          explode: false
          in: query
          name: state
          schema:
            description: Only sessions in this state.
            enum:
              - pending
              - running
              - exited
              - failed_to_start
              - killed
              - timed_out
              - lost
            type: string
        - description: Only sessions of this key. Other keys' sessions need the admin:read scope.
          explode: false
          in: query
          name: key_id
          schema:
            description: Only sessions of this key. Other keys' sessions need the admin:read scope.
            type: string
        - description: Only sessions with this label, written key=value. Repeat for several.
          explode: true
          in: query
          name: label
          schema:
            description: Only sessions with this label, written key=value. Repeat for several.
            examples:
              - - team=infra
            items:
              type: string
            type:
              - array
              - "null"
        - explode: false
          in: query
          name: limit
          schema:
            default: 50
            format: int64
            maximum: 500
            minimum: 1
            type: integer
        - description: The next_cursor of the previous page.
          explode: false
          in: query
          name: cursor
          schema:
            description: The next_cursor of the previous page.
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - bearer: []
      summary: List sessions
      tags:
        - Sessions
    post:
      description: Starts a process. Without `wait` it returns the session at once (201). With `wait=true` it returns the session and its output when the process ends or `wait_timeout` passes (200). A process that fails to start still creates a session, in state `failed_to_start`.
      operationId: create-session
      parameters:
        - description: Wait for the session to end and return its output. Stdin is closed after the initial input.
          explode: false
          in: query
          name: wait
          schema:
            description: Wait for the session to end and return its output. Stdin is closed after the initial input.
            type: boolean
        - description: With wait, return after this long even if the session is still running.
          explode: false
          in: query
          name: wait_timeout
          schema:
            description: With wait, return after this long even if the session is still running.
            examples:
              - 30s
            type: string
        - description: With wait, the most bytes of each stream to return.
          explode: false
          in: query
          name: max_output
          schema:
            default: 1048576
            description: With wait, the most bytes of each stream to return.
            format: int64
            maximum: 67108864
            minimum: 0
            type: integer
        - description: With wait, which part of truncated output to keep.
          explode: false
          in: query
          name: keep
          schema:
            default: tail
            description: With wait, which part of truncated output to keep.
            enum:
              - head
              - tail
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionSpec"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunResult"
          description: "With wait=true: the session and its output."
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
          description: The session was started.
          headers:
            Location:
              schema:
                type: string
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "401":
          content:
            application/problem+json:
