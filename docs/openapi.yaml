  /v2/sessions/{id}/attach:
    get:
      description: Upgrades to a WebSocket that replays the session's events from `from` and then follows them. Unless `readonly=true`, the client may also send stdin and signals, which needs the sessions:run scope and ownership of the session. Attaching to a finished session replays its events and closes.
      operationId: attach
      parameters:
        - description: Session id
          in: path
          name: id
          required: true
          schema:
            description: Session id
            examples:
              - ses_01j9z3k5q8m2x7v4w6t0b1c3d5
            type: string
        - description: First sequence number to send.
          explode: false
          in: query
          name: from
          schema:
            default: 1
            description: First sequence number to send.
            format: int64
            minimum: 0
            type: integer
        - description: Only receive events; stdin and signal messages are rejected. Needs only the sessions:read scope.
          explode: false
          in: query
          name: readonly
          schema:
            description: Only receive events; stdin and signal messages are rejected. Needs only the sessions:read scope.
            type: boolean
      responses:
        "101":
          description: "Switching Protocols: the connection is now a WebSocket using the shhttp.v2.json protocol."
        "200":
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - bearer: []
      summary: Attach to a session over a WebSocket
      tags:
        - WebSocket
  /v2/sessions/{id}/events:
    get:
      description: "Returns events from `from` onwards; with `follow=true` keeps streaming until the session ends. Formats: newline-delimited JSON (default), server-sent events (`Accept: text/event-stream` or `format=sse`; each event's `id` is its sequence number) or raw output bytes of one stream (`format=raw`)."
      operationId: get-session-events
      parameters:
        - description: Session id
          in: path
          name: id
          required: true
          schema:
            description: Session id
            examples:
              - ses_01j9z3k5q8m2x7v4w6t0b1c3d5
            type: string
        - description: First sequence number to return.
          explode: false
          in: query
          name: from
          schema:
            default: 1
            description: First sequence number to return.
            format: int64
            minimum: 0
            type: integer
        - description: Keep the response open and stream new events until the session ends.
          explode: false
          in: query
          name: follow
          schema:
            description: Keep the response open and stream new events until the session ends.
            type: boolean
        - description: Overrides the Accept header.
          explode: false
          in: query
          name: format
          schema:
            description: Overrides the Accept header.
            enum:
              - ndjson
              - sse
              - raw
            type: string
        - description: For the raw format, which stream to return.
          explode: false
          in: query
          name: stream
          schema:
            default: stdout
            description: For the raw format, which stream to return.
            enum:
              - stdout
              - stderr
            type: string
        - in: header
          name: Accept
          schema:
            type: string
        - description: Server-sent events resume after this sequence number.
          in: header
          name: Last-Event-ID
          schema:
            description: Server-sent events resume after this sequence number.
            type: string
      responses:
        "200":
          content:
            application/octet-stream:
              schema:
                contentMediaType: application/octet-stream
                format: binary
                type: string
            application/x-ndjson:
              schema:
                $ref: "#/components/schemas/Event"
            text/event-stream:
              schema:
                description: "`id: <seq>` and `data: <event JSON>` per event."
                type: string
          description: The events.
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - bearer: []
      summary: Read or follow a session's events
      tags:
        - Sessions
