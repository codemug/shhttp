version: 2
project_name: shhttp

builds:
  - id: shhttpd
    main: ./cmd/shhttpd
    binary: shhttpd
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{.Version}}"]
  - id: shhttp
    main: ./cmd/shhttp
    binary: shhttp
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{.Version}}"]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [README.md, LICENSE, docs/*]

checksum:
  name_template: checksums.txt

changelog:
  use: github
